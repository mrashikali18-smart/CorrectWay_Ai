{% extends "base.html" %}
{% block content %}
<main class="mx-auto flex max-w-2xl flex-col px-6 py-16">
  <div class="mb-2 flex items-center justify-between font-mono text-xs text-mist/50">
    <span id="progress-label">Question 1 / 25</span>
    <span id="progress-pct">0%</span>
  </div>

  <!-- Waypoint progress path -->
  <div id="progress-path" class="mb-10 flex gap-1"></div>

  <p class="font-mono text-xs uppercase tracking-widest text-teal" id="question-kind">Strength check</p>
  <h1 class="mt-3 font-display text-2xl leading-snug text-mist md:text-3xl" id="question-text"></h1>

  <div class="mt-10 flex gap-4">
    <button id="btn-yes" class="focus-ring flex-1 btn-glow rounded-2xl border border-teal/40 bg-teal/10 py-5 font-body text-lg font-semibold text-teal hover:bg-teal/20 transition-colors disabled:opacity-60">
      Yes <span class="font-mono text-xs text-teal/60">(Y)</span>
    </button>
    <button id="btn-no" class="focus-ring flex-1 rounded-xl border border-line bg-slate py-5 font-body text-lg font-semibold text-mist/70 hover:bg-slate/70 transition-colors disabled:opacity-60">
      No <span class="font-mono text-xs text-mist/40">(N)</span>
    </button>
  </div>

  <button id="btn-back" class="focus-ring mt-6 hidden self-start font-body text-sm text-mist/40 hover:text-mist/70 transition-colors">
    ← Back
  </button>

  <p id="submitting-note" class="mt-6 hidden font-mono text-xs text-mist/40">Analyzing your answers…</p>
</main>

<script>
  const QUESTIONS = {{ questions_json|safe }};

  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
  }

  const ACTIVE_CSRF_TOKEN = getCookie("csrftoken");

  let index = 0;
  const answers = {};
  let submitting = false;

  const progressLabel = document.getElementById("progress-label");
  const progressPct = document.getElementById("progress-pct");
  const progressPath = document.getElementById("progress-path");
  const questionKind = document.getElementById("question-kind");
  const questionText = document.getElementById("question-text");
  const btnYes = document.getElementById("btn-yes");
  const btnNo = document.getElementById("btn-no");
  const btnBack = document.getElementById("btn-back");
  const submittingNote = document.getElementById("submitting-note");

  function renderProgressPath() {
    progressPath.innerHTML = "";
    QUESTIONS.forEach((_, i) => {
      const bar = document.createElement("div");
      let colorClass = "bg-line";
      if (i < index) colorClass = "bg-teal";
      else if (i === index) colorClass = "bg-gold";
      bar.className = `h-1.5 flex-1 rounded-full transition-colors ${colorClass}`;
      progressPath.appendChild(bar);
    });
  }

  function render() {
    const current = QUESTIONS[index];
    progressLabel.textContent = `Question ${index + 1} / ${QUESTIONS.length}`;
    progressPct.textContent = `${Math.round((index / QUESTIONS.length) * 100)}%`;
    renderProgressPath();
    questionKind.textContent = current.routine_flag ? "Work-style" : "Strength check";
    questionText.textContent = current.text;
    btnBack.classList.toggle("hidden", index === 0);
  }

  function setBusy(busy) {
    submitting = busy;
    btnYes.disabled = busy;
    btnNo.disabled = busy;
    submittingNote.classList.toggle("hidden", !busy);
  }

  async function submitQuiz() {
    setBusy(true);
    try {
      const res = await fetch("{% url 'quiz_submit' %}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": ACTIVE_CSRF_TOKEN,
        },
        body: JSON.stringify({ answers }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || "Something went wrong.");
      window.location.href = data.redirect || "{% url 'results' %}";
    } catch (err) {
      // Never dead-end the quiz — fall back to sending the user to the
      // results page anyway; results_view() will show the "no analysis
      // yet" state if the session truly has nothing to show.
      window.location.href = "{% url 'results' %}";
    } finally {
      setBusy(false);
    }
  }

  function answer(value) {
    if (submitting) return;
    const current = QUESTIONS[index];
    answers[current.id] = value;

    if (index + 1 < QUESTIONS.length) {
      index += 1;
      render();
      return;
    }
    submitQuiz();
  }

  btnYes.addEventListener("click", () => answer(true));
  btnNo.addEventListener("click", () => answer(false));
  btnBack.addEventListener("click", () => {
    if (index > 0) {
      index -= 1;
      render();
    }
  });

  window.addEventListener("keydown", (e) => {
    if (submitting) return;
    if (e.key === "y" || e.key === "Y") answer(true);
    if (e.key === "n" || e.key === "N") answer(false);
    if (e.key === "ArrowLeft" && index > 0) {
      index -= 1;
      render();
    }
  });

  render();
</script>
{% endblock %}
